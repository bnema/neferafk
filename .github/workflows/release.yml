name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Releases are published by ermite (git.bnema.dev); the GitHub mirror
  # receives the tags but must not publish a second release or AUR push.
  check:
    if: github.server_url != 'https://github.com'
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: aur-bin
          path: dist/aur/neferafk-bin.pkgbuild
          if-no-files-found: error

  # makepkg must run on Arch as a non-root user. publish.sh builds each
  # package, verifies every source checksum, then pushes it.
  aur:
    needs: release
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [neferafk-bin, neferafk-git]
    # Pre-releases (v0.2.0-rc1) stay off the AUR: pacman sorts 0.2.0.rc1
    # after 0.2.0, so the final release would not look like an upgrade.
    env:
      SKIP: ${{ contains(github.ref_name, '-') }}
    steps:
      - run: >-
          pacman -Syu --noconfirm --needed
          base-devel git openssh sudo
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: matrix.pkg == 'neferafk-bin' && env.SKIP != 'true'
        uses: actions/download-artifact@v8
        with:
          name: aur-bin
          path: aur-bin
      - name: Create the build user
        run: |
          useradd -m builder
          echo 'builder ALL=(root) NOPASSWD: /usr/bin/pacman' >/etc/sudoers.d/builder
      - name: Build, verify and publish ${{ matrix.pkg }}
        if: env.SKIP != 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
          PKG: ${{ matrix.pkg }}
        run: |
          if [ "$PKG" = neferafk-bin ]; then
            pkgbuild=aur-bin/neferafk-bin.pkgbuild
          else
            pkgbuild=packaging/aur/neferafk-git/PKGBUILD
          fi
          chmod -R a+rX "$GITHUB_WORKSPACE"
          sudo -u builder --preserve-env=AUR_SSH_PRIVATE_KEY,AUR_USERNAME,AUR_EMAIL \
            packaging/aur/publish.sh "$PKG" "$pkgbuild"
